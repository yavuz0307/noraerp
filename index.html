function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
/* ===== ORTAK BULUT VERİ (erp_state) — koleksiyon başına 1 satır ===== */
function upsertState(key,data){ if(!SB) return; SB.from("erp_state").upsert({key,data,updated_at:new Date().toISOString()}).then(function(r){ if(r&&r.error) console.warn("bulut kayıt hatası:",key,r.error.message); }); }
function saveO(){ upsertState("orders",ORDERS); }

function saveS(){ upsertState("stock",STOCK); }
function saveSL(){ upsertState("stocklog",STOCKLOG); }
function saveC(){ upsertState("cari",CARI); }
// Buluttaki tüm koleksiyonları oku → dizilere yükle. Eksik olanları varsayılanla oluştur.
async function loadAllFromCloud(){
  if(!SB) return;
  const {data,error}=await SB.from("erp_state").select("key,data");
  if(error){ throw error; }
  const map={}; (data||[]).forEach(function(r){ map[r.key]=r.data; });
  if(map.customers) CUSTOMERS=map.customers; else upsertState("customers",CUSTOMERS);
  if(map.products)  PRODUCTS=map.products;   else upsertState("products",PRODUCTS);
  if(map.orders)    ORDERS=map.orders;       else upsertState("orders",ORDERS);
  if(map.teams)     TEAMS=map.teams;         else upsertState("teams",TEAMS);
  if(map.stock)     STOCK=map.stock;         else upsertState("stock",STOCK);
  if(map.stocklog)  STOCKLOG=map.stocklog;   else upsertState("stocklog",STOCKLOG);
  if(map.cari)      CARI=map.cari;           else upsertState("cari",CARI);
}
// Realtime: başka kullanıcı yazınca ilgili diziyi güncelle + ekranı tazele
function subscribeRealtime(){
  if(!SB||window.__erpSub) return; window.__erpSub=true;
  SB.channel("erp_state_ch").on("postgres_changes",{event:"*",schema:"public",table:"erp_state"},function(p){
    const row=p.new||p.old; if(!row||!row.key) return; const d=(p.new&&p.new.data);
    if(d==null) return;
    if(row.key==="customers")CUSTOMERS=d; else if(row.key==="products")PRODUCTS=d; else if(row.key==="orders")ORDERS=d;
    else if(row.key==="teams")TEAMS=d; else if(row.key==="stock")STOCK=d; else if(row.key==="stocklog")STOCKLOG=d; else if(row.key==="cari")CARI=d;
    if(USER) render();
  }).subscribe();
}
function cariAdd(musteri,tur,borc,alacak,aciklama,orderId){CARI.push({t:now(),musteri,tur,borc:borc||0,alacak:alacak||0,aciklama:aciklama||"",orderId:orderId||null,kisi:(USER&&USER.ad)||"—"});saveC();}
function cariBalances(){const m={};CARI.forEach(e=>{const c=m[e.musteri]=m[e.musteri]||{musteri:e.musteri,borc:0,alacak:0};c.borc+=e.borc;c.alacak+=e.alacak;});return Object.values(m).map(c=>({...c,bakiye:c.borc-c.alacak})).sort((a,b)=>b.bakiye-a.bakiye);}
function stockLog(key,delta,sebep){STOCKLOG.push({t:now(),key,delta,sebep,kisi:(USER&&USER.ad)||"—"});saveSL();}
// muhasebe onayında: stok yeterse otomatik düş, yetmezse KALAN satın almaya düşer
function allocateStock(o){
  if(o.stokAyrildi)return; o.stokAyrildi=true;
  o.aksesuar.forEach(a=>{const k=a.cat+"|"+a.detay;const it=STOCK[k];const avail=it?it.qty:0;const use=Math.max(0,Math.min(avail,a.adet));
    a.stokDusen=use;
    if(use>0){it.qty-=use;stockLog(k,-use,"İş emri "+o.id+" · "+o.urunAdi);}
    a.durum=(use>=a.adet)?"Stok":"Bekliyor"; // tam karşılandı=Stok, eksik/yok=satın almaya
  });
  o.satinAlmaTamam=o.aksesuar.every(a=>a.durum==="Stok"||a.durum==="Teslim");
  saveS();
}
function saveU(){/* oturum Supabase'te tutulur — yerelde saklamıyoruz */}
const TL=n=>(Math.round(n||0)).toLocaleString("tr-TR");
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const stColor=s=>({"Dizayn Ofis":"#6a6a5c","Muhasebe":"#2f6fd6","Satın Alma":"#c79a3b","Üretim":"#2a4a3a","Üretim · Bekliyor":"#c07a12","Üretim · Devam":"#2a4a3a","Sevkiyat":"#1b7a3a"}[s]||"#6a6a5c");
const stationIdx=o=>STATIONS.indexOf(o.durum);
const accTotal=l=>l.reduce((s,a)=>s+(PRICE[a[0]]||a.cat&&PRICE[a.cat]||0)*(a[3]||a.adet||0),0);
function can(k){return USER && ROLE_NAV[USER.role].includes(k)}
// muhasebe onaylandı → aksesuarlar satın almaya düştü (paralel), proje üretimde
const inPurchasing=o=>o.muhasebeOnay && o.durum!=="Sevkiyat";       // aksesuarları satın almada
const uretimBekliyor=o=>o.durum==="Üretim" && !o.satinAlmaTamam;    // üretimde ama tedarik bekliyor
// ---- tarih/saat + istasyon başla/bitir kayıtları ----
const now=()=>new Date().toISOString();
function fmtDT(iso){if(!iso)return "—";const d=new Date(iso);return d.toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function durTxt(a,b){if(!a||!b)return "—";let ms=new Date(b)-new Date(a);if(ms<0)ms=0;const m=Math.round(ms/60000);if(m<1)return "1 dk";if(m<60)return m+" dk";const h=Math.floor(m/60);return h+" sa "+(m%60?(m%60)+" dk":"");}
function logEv(o,ad,olay){o.log=o.log||[];o.log.push({t:now(),ad,olay,kisi:(USER&&USER.ad)||"—"});}
const stepDone=(o,s)=>!!(o.steps&&o.steps[s]&&o.steps[s].end);
const stepRun=(o,s)=>!!(o.steps&&o.steps[s]&&o.steps[s].start&&!o.steps[s].end);
function stepAction(id,step){const o=ORDERS.find(x=>x.id===id);if(!o)return;
  const s=o.steps[step]||(o.steps[step]={start:null,end:null,byStart:"",byEnd:""});
  if(!s.start){s.start=now();s.byStart=(USER&&USER.ad)||"—";logEv(o,step,"Başladı");}
  else if(!s.end){s.end=now();s.byEnd=(USER&&USER.ad)||"—";logEv(o,step,"Bitti");}
  else {s.start=null;s.end=null;s.byStart="";s.byEnd="";logEv(o,step,"Sıfırlandı");}
  if(PROD_STEPS.every(x=>o.steps[x]&&o.steps[x].end)&&o.durum==="Üretim"){o.durum="Sevkiyat";logEv(o,"Üretim","Tamamlandı → Sevkiyat");}
  saveO();render();}

let _signupMode=false;
function lgMsg(t,ok){ const e=document.getElementById("lgMsg"); if(!e)return; e.textContent=t||""; e.style.color=ok?"var(--ok)":"var(--red)"; }

  document.getElementById("lgToggle").textContent=_signupMode?"Zaten hesabın var mı? Giriş yap":"Hesabın yok mu? Kayıt ol";

function trAuthErr(m){ m=m||"";
  if(/Invalid login credentials/i.test(m)) return "E-posta veya şifre hatalı.";
  if(/already registered|already been registered/i.test(m)) return "Bu e-posta zaten kayıtlı. Giriş yapın.";
  if(/Email not confirmed/i.test(m)) return "E-posta onaylanmadı. Gelen kutunuzu kontrol edin.";
  if(/rate limit/i.test(m)) return "Çok fazla deneme. Biraz bekleyip tekrar deneyin.";
  return m;
}
function doLogin(){
  if(!SB){ lgMsg("Bağlantı kurulamadı (internet / Supabase)."); return; }
  const mail=(document.getElementById("lgMail").value||"").trim().toLowerCase();
  const pass=(document.getElementById("lgPass").value||"");
  if(!mail||pass.length<6){ lgMsg("E-posta ve en az 6 karakterli şifre girin."); return; }
  const btn=document.getElementById("lgBtn"); btn.disabled=true;
  if(_signupMode){
    lgMsg("Kayıt oluşturuluyor…",true);
    SB.auth.signUp({email:mail,password:pass}).then(function(r){ btn.disabled=false;
      if(r.error){ lgMsg(trAuthErr(r.error.message)); return; }
      if(r.data&&r.data.session){ afterAuth(r.data.session.user); }
      else { lgMsg("Kayıt alındı ✓ (E-posta onayı gerekiyorsa gelen kutunu kontrol et.) Sonra yönetici seni yetkilendirmeli.",true); toggleSignup(); }
    });
  } else {
    lgMsg("Giriş yapılıyor…",true);
    SB.auth.signInWithPassword({email:mail,password:pass}).then(function(r){ btn.disabled=false;
      if(r.error){ lgMsg(trAuthErr(r.error.message)); return; }
      afterAuth(r.data.user);
    });
  }
}
function doForgot(){
  if(!SB) return; const mail=(document.getElementById("lgMail").value||"").trim().toLowerCase();
  if(!mail){ lgMsg("Önce e-posta adresini yaz."); return; }
  SB.auth.resetPasswordForEmail(mail,{redirectTo:location.href}).then(function(r){ lgMsg((r&&r.error)?trAuthErr(r.error.message):"Sıfırlama bağlantısı e-postana gönderildi ✓",!(r&&r.error)); });
}
async function afterAuth(u){
  try{
    lgMsg("Yükleniyor…",true);
    let mem=null;
    try{ const q=await SB.from("erp_members").select("role,ad").eq("id",u.id).single(); mem=q.data; }catch(e){}
    const role=mem&&mem.role;
    if(!role||role==="pending"){ showPending(u); return; }
    USER={ id:u.id, mail:u.email, ad:(mem&&mem.ad)||u.email.split("@")[0], role:role };
    await loadAllFromCloud();
    subscribeRealtime();
    boot();

function _val(id){const e=document.getElementById(id);return e?e.value:"";}
function nextCodes(){
  const yr=new Date().getFullYear();
  const seq=CUSTOMERS.reduce((s,c)=>s+c.urunler.length,0)+1;
  const n=String(seq).padStart(3,"0");
  return { proje:`PRJ-${yr}-${n}`, urun:`URN-${yr}-${n}` };
}

let _members=null;
function view_kullanicilar(){
  if(_members===null) loadMembers();

  const rows=(_members||[]).map(function(m){
    const sel=roles.map(function(r){return `<option value="${r}" ${m.role===r?'selected':''}>${r}</option>`}).join("");
    return `<tr><td><b>${esc(m.ad||"")}</b></td><td>${esc(m.email||"")}</td><td><select onchange="setMemberRole('${m.id}',this.value)" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px">${sel}</select></td></tr>`;
  }).join("") || `<tr><td colspan="3" class="muted c" style="padding:16px">${_members?"Kayıtlı kullanıcı yok.":"Yükleniyor…"}</td></tr>`;

async function loadMembers(){
  if(!SB) return;
  try{ const {data}=await SB.from("erp_members").select("id,email,ad,role,created_at").order("created_at",{ascending:true}); _members=data||[]; }catch(e){ _members=[]; }

}
function setMemberRole(id,role){
  if(!SB) return;
  SB.from("erp_members").update({role:role}).eq("id",id).then(function(r){ if(r&&r.error){ alert("Rol güncellenemedi (yönetici mi?): "+r.error.message); } else { _members=null; if(ACTIVE==="kullanicilar") render(); } });

function prodFormFields(pfx, codes){

function buildProduct(pfx){
  const un=(_val(pfx+"Urun")||"").trim(); if(!un) return null;
  const codes=nextCodes();
  return { projeKodu:(_val(pfx+"Proje")||"").trim()||codes.proje, urunAdi:un, urunKodu:(_val(pfx+"Kod")||"").trim()||codes.urun,
    modul:+_val(pfx+"Modul")||0, m2:+_val(pfx+"M2")||0, malzeme:+_val(pfx+"Mal")||0, aksesuar:[] };
}
function onProdSelect(pfx){
  const sel=document.getElementById(pfx+"Sel"); if(!sel) return; const ad=sel.value; if(!ad) return;
  const it=PRODUCTS.find(p=>p.ad===ad);
  const setv=(id,v)=>{const e=document.getElementById(id); if(e&&v!=null&&v!=="") e.value=v;};
  setv(pfx+"Urun", ad);
  if(it){ if(it.modul) setv(pfx+"Modul",it.modul); if(it.m2) setv(pfx+"M2",it.m2); if(it.malzeme) setv(pfx+"Mal",it.malzeme); }
}

function addCatalogItem(){
  const ad=(_val("catAd")||"").trim(); if(!ad){alert("Ürün türü adı zorunlu.");return;}

function currentStep(o){for(const s of PROD_STEPS){if(!stepDone(o,s))return s;}return null;}
// üretim panosu: kartı istasyon koluna sürükle
function moveProd(id,key){const o=ORDERS.find(x=>x.id===id);if(!o)return;
  if(key==="wait"){o.satinAlmaTamam=false;o.durum="Üretim";logEv(o,"Üretim","Tedarik bekliyor'a alındı (sürükle)");saveO();render();return;}
  o.muhasebeOnay=true;o.satinAlmaTamam=true;allocateStock(o);
  if(key==="done"){PROD_STEPS.forEach(s=>{const st=o.steps[s]||(o.steps[s]={start:null,end:null,byStart:"",byEnd:""});if(!st.start){st.start=now();st.byStart=(USER&&USER.ad)||"—";}if(!st.end){st.end=now();st.byEnd=(USER&&USER.ad)||"—";}});o.durum="Sevkiyat";logEv(o,"Üretim","Tamamlandı → Sevk (sürükle)");saveO();render();return;}
  const idx=PROD_STEPS.indexOf(key);if(idx<0)return;o.durum="Üretim";
  PROD_STEPS.forEach((s,i)=>{const st=o.steps[s]||(o.steps[s]={start:null,end:null,byStart:"",byEnd:""});
    if(i<idx){if(!st.start){st.start=now();st.byStart=(USER&&USER.ad)||"—";}if(!st.end){st.end=now();st.byEnd=(USER&&USER.ad)||"—";}}
    else if(i===idx){if(!st.start){st.start=now();st.byStart=(USER&&USER.ad)||"—";}st.end=null;st.byEnd="";}
    else{st.start=null;st.end=null;st.byStart="";st.byEnd="";}});
  logEv(o,key,"İstasyona alındı (sürükle)");saveO();render();
}
function pfDropProd(e,key){e.preventDefault();e.currentTarget.classList.remove("dropon");const id=window._dragId||(e.dataTransfer&&e.dataTransfer.getData("text/plain"));window._dragId=null;if(id)moveProd(id,key);}
function prodCard(o){const cs=currentStep(o);const st=cs?(o.steps[cs]||{}):{};const run=cs&&stepRun(o,cs);

function setStockQty(key,v){const it=STOCK[key];if(!it)return;const nv=Math.max(0,Math.round(+v||0));const d=nv-it.qty;it.qty=nv;if(d)stockLog(key,d,"Elle düzeltme");saveS();render();}
function stockMove(key,d){const it=STOCK[key];if(!it)return;it.qty=Math.max(0,it.qty+d);stockLog(key,d,"Elle "+(d>0?"giriş":"çıkış"));saveS();render();}
function addStockItem(){

  const birim=(document.getElementById("stBirim").value||"adet").trim();const qty=Math.max(0,Math.round(+document.getElementById("stQty").value||0));
  if(!cat){alert("Malzeme adı gir");return;}
  const k=cat+"|"+detay; STOCK[k]={cat,detay,birim,qty}; stockLog(k,qty,"Yeni kalem"); saveS(); render();
}
function view_stok(){
  const items=Object.entries(STOCK).sort((a,b)=>a[1].cat.localeCompare(b[1].cat,"tr"));
  const low=items.filter(([k,it])=>it.qty<=5).length;

      <button class="btn ghost sm" onclick="stockMove('${k.replace(/'/g,"\\'")}',1)">＋</button></td>
    <td class="c">${it.qty<=0?'<span class="pill" style="background:#fbeae8;color:#c0392b">Tükendi</span>':it.qty<=5?'<span class="pill" style="background:#fdf3e3;color:#c07a12">Az</span>':'<span class="pill" style="background:#e7f5ec;color:#1b7a3a">Yeterli</span>'}</td>
  </tr>`).join("");
  const mv=STOCKLOG.slice().reverse().slice(0,40).map(e=>{const it=STOCK[e.key];const nm=it?`${it.cat} · ${it.detay}`:e.key;
    return `<tr><td>${fmtDT(e.t)}</td><td>${esc(nm)}</td><td class="r" style="color:${e.delta<0?'#c0392b':'#1b7a3a'};font-weight:800">${e.delta>0?'+':''}${e.delta}</td><td>${esc(e.sebep)}</td><td>${esc(e.kisi)}</td></tr>`;}).join("")||`<tr><td colspan="5" class="c muted">Hareket yok</td></tr>`;
  return `<div class="top"><div><h1>Stok</h1><div class="sub">muhasebe onayında aksesuar stoktan otomatik düşer; yoksa satın almaya gider</div></div><div class="spacer"></div>
    <div class="kpi" style="margin:0;min-width:130px"><div class="n">${items.length}</div><div class="l">Stok kalemi</div></div>
    ${low?`<div class="kpi" style="margin:0;min-width:130px"><div class="n" style="color:#c07a12">${low}</div><div class="l">Azalan / tükenen</div></div>`:""}</div>
    <div class="card"><div class="hd">Stok Kalemleri <span class="sub">adet değiştir: −/＋ veya kutuya yaz</span></div>
      <div class="tblwrap"><table><thead><tr><th>Malzeme</th><th>Detay</th><th class="c">Birim</th><th class="c">Stok Adedi</th><th class="c">Durum</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:end">
        <div><label style="font-size:11px;font-weight:800;color:#6b6b5e">Malzeme</label><br><input id="stCat" placeholder="Menteşe" style="padding:8px;border:1px solid var(--line);border-radius:7px"></div>
        <div><label style="font-size:11px;font-weight:800;color:#6b6b5e">Detay</label><br><input id="stDetay" placeholder="Blum..." style="padding:8px;border:1px solid var(--line);border-radius:7px"></div>

      <div class="tblwrap"><table><thead><tr><th>Tarih / Saat</th><th>Malzeme</th><th class="r">Değişim</th><th>Sebep</th><th>Kişi</th></tr></thead><tbody>${mv}</tbody></table></div></div>`;
}

/* ============ GENEL RAPOR (grafikli müşteri özeti) ============ */
const STAT_DEF=[["Muhasebe","#2f6fd6"],["Üretim · Bekliyor","#c07a12"],["Üretim · Devam","#2a4a3a"],["Sevkiyat","#1b7a3a"]];
function statKey(o){return o.durum==="Üretim"?(o.satinAlmaTamam?"Üretim · Devam":"Üretim · Bekliyor"):o.durum;}
function svgDonut(segs,size){
  const total=segs.reduce((s,x)=>s+x.val,0)||0;const r=size/2-16,cx=size/2,cy=size/2,C=2*Math.PI*r;let off=0;
  const arcs=total?segs.filter(s=>s.val>0).map(s=>{const len=C*s.val/total;const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=len;return el;}).join(""):`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eceadf" stroke-width="22"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="28" font-weight="900" fill="#1b3328">${total}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="11" fill="#8a8578">iş emri</text></svg>`;
}
function hbar(rows,fmt){const max=Math.max(1,...rows.map(r=>r.val));
  return rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
    <div style="width:120px;font-size:12px;font-weight:700;text-align:right;color:#4a4a3f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</div>
    <div style="flex:1;background:#f0ece2;border-radius:6px;height:22px;position:relative;min-width:60px">
      <div style="width:${Math.max(2,Math.round(r.val/max*100))}%;background:${r.color};height:100%;border-radius:6px"></div>
      <span style="position:absolute;right:8px;top:3px;font-size:11px;font-weight:800;color:#20241f">${fmt?fmt(r.val):r.val}</span></div></div>`).join("")||`<div class="muted">Veri yok</div>`;
}
function setOzF(k,v){window._ozF=window._ozF||{cust:"",durum:"",q:""};window._ozF[k]=v;render();}
function ozRows(){const f=window._ozF||{cust:"",durum:"",q:""};const q=(f.q||"").toLocaleLowerCase("tr");
  return ORDERS.filter(o=>{
    if(f.cust&&o.musteri!==f.cust)return false;
    if(f.durum&&statKey(o)!==f.durum)return false;
    if(q&&!(`${o.musteri} ${o.urunAdi} ${o.urunKodu} ${o.projeKodu} ${o.id}`.toLocaleLowerCase("tr").includes(q)))return false;
    return true;
  });
}
function ozCSV(){const rows=ozRows();const H=["İş Emri","Müşteri","Ürün","Ürün Kodu","Proje Kodu","Durum","Modül","Yüzey m²","Malzeme","Aksesuar","Toplam","Termin","İlerleme %"];
  const line=a=>a.map(x=>`"${String(x==null?"":x).replace(/"/g,'""')}"`).join(";");
  const body=rows.map(o=>{const at=accTotal(o.aksesuar);const d=PROD_STEPS.filter(s=>stepDone(o,s)).length;
    return line([o.id,o.musteri,o.urunAdi,o.urunKodu,o.projeKodu,statKey(o),o.modul,o.m2,o.malzeme,at,o.malzeme+at,o.termin||"",Math.round(d/PROD_STEPS.length*100)]);}).join("\r\n");
  const csv="﻿"+line(H)+"\r\n"+body;const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="genel-rapor.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function view_ozet(){
  window._ozF=window._ozF||{cust:"",durum:"",q:""};
  const agg={};CUSTOMERS.forEach(c=>agg[c.ad]={ad:c.ad,urun:c.urunler.length,n:0,ciro:0,durum:{},done:0});
  ORDERS.forEach(o=>{const c=agg[o.musteri]||(agg[o.musteri]={ad:o.musteri,urun:0,n:0,ciro:0,durum:{},done:0});
    c.n++;c.ciro+=o.malzeme+accTotal(o.aksesuar);const k=statKey(o);c.durum[k]=(c.durum[k]||0)+1;if(o.durum==="Sevkiyat")c.done++;});
  const custs=Object.values(agg);
  const totCust=custs.length,totUrun=CUSTOMERS.reduce((s,c)=>s+c.urunler.length,0);
  const totOrders=ORDERS.length,openOrders=ORDERS.filter(o=>o.durum!=="Sevkiyat").length;
  const totCiro=ORDERS.reduce((s,o)=>s+o.malzeme+accTotal(o.aksesuar),0);
  const done=ORDERS.filter(o=>o.durum==="Sevkiyat").length;
  const statCount={};ORDERS.forEach(o=>{const k=statKey(o);statCount[k]=(statCount[k]||0)+1;});
  const donSegs=STAT_DEF.map(([k,c])=>({label:k,color:c,val:statCount[k]||0}));
  const legend=STAT_DEF.map(([k,c])=>`<div style="display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:6px"><span class="dot" style="background:${c}"></span>${k}<span class="spacer"></span><b>${statCount[k]||0}</b></div>`).join("");
  const kpi=(n,l)=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const ciroRows=custs.slice().sort((a,b)=>b.ciro-a.ciro).map(c=>({label:c.ad,val:c.ciro,color:"#c79a3b"}));
  const stacked=custs.map(c=>{const segs=STAT_DEF.map(([k,col])=>({k,col,v:c.durum[k]||0})).filter(s=>s.v>0);
    const bar=c.n?segs.map(s=>`<div style="width:${(s.v/c.n*100).toFixed(1)}%;background:${s.col}" title="${s.k}: ${s.v}"></div>`).join(""):`<div style="flex:1;background:#f0ece2"></div>`;
    return `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${esc(c.ad)}</b><span class="muted">${c.urun} ürün · ${c.n} emir · ${c.done} sevk</span></div>
      <div style="display:flex;height:18px;border-radius:6px;overflow:hidden;margin-top:4px;background:#f0ece2">${bar}</div></div>`;}).join("");
  const activeProg=ORDERS.filter(o=>(o.durum==="Üretim"&&o.satinAlmaTamam)||o.durum==="Sevkiyat").map(o=>{const d=PROD_STEPS.filter(s=>stepDone(o,s)).length;return {label:o.musteri+" · "+o.urunAdi,val:Math.round(d/PROD_STEPS.length*100),color:"#2a4a3a"};});
  return `<div class="top"><div><h1>Genel Rapor</h1><div class="sub">müşteri durum özeti · grafikli</div></div></div>
    <div class="kpis">${kpi(totCust,"Müşteri")}${kpi(totUrun,"Ürün")}${kpi(openOrders,"Açık iş emri")}${kpi(done,"Sevke hazır")}${kpi("₺"+TL(totCiro),"Toplam iş yükü")}</div>
    <div class="ozet-grid">
      <div class="card"><div class="hd">İş Emri Durum Dağılımı</div>
        <div style="padding:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div>${svgDonut(donSegs,180)}</div><div style="flex:1;min-width:180px">${legend}</div></div></div>
      <div class="card"><div class="hd">Müşteri Bazında İş Yükü (₺)</div><div style="padding:16px">${hbar(ciroRows,v=>"₺"+TL(v))}</div></div>
      <div class="card"><div class="hd">Müşteri Durum Kırılımı</div><div style="padding:16px">${stacked||'<div class="muted">Veri yok</div>'}
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;border-top:1px solid var(--line);padding-top:10px">${STAT_DEF.map(([k,c])=>`<span style="font-size:11px;display:flex;align-items:center;gap:6px"><span class="dot" style="background:${c}"></span>${k}</span>`).join("")}</div></div></div>
      <div class="card"><div class="hd">Üretim İlerlemesi</div><div style="padding:16px">${activeProg.length?hbar(activeProg,v=>v+"%"):'<div class="muted">Üretimde aktif iş yok</div>'}</div></div>
    </div>
    ${ozListCard()}`;
}
function ozListCard(){
  const f=window._ozF||{cust:"",durum:"",q:""};
  const custNames=[...new Set([...CUSTOMERS.map(c=>c.ad),...ORDERS.map(o=>o.musteri)])];
  const rows=ozRows();
  const tSum=rows.reduce((s,o)=>s+o.malzeme+accTotal(o.aksesuar),0);
  const inp={padding:"8px 10px",border:"1px solid var(--line)",borderRadius:"8px",fontSize:"12.5px",fontWeight:"700"};
  const _s=Object.entries(inp).map(([k,v])=>`${k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())}:${v}`).join(";");
  const body=rows.map(o=>{const at=accTotal(o.aksesuar);const d=PROD_STEPS.filter(s=>stepDone(o,s)).length;const pct=Math.round(d/PROD_STEPS.length*100);const k=statKey(o);
    return `<tr onclick="openJob('${o.id}')" style="cursor:pointer"><td><b>${o.id}</b></td><td>${esc(o.musteri)}</td>
      <td>${esc(o.urunAdi)}<div class="muted" style="font-size:11px">${o.urunKodu} · ${o.projeKodu}</div></td>
      <td><span class="pill" style="background:${stColor(k)}22;color:${stColor(k)}">${k}</span></td>
      <td class="c">${o.modul}</td><td class="r">${o.m2} m²</td><td class="r"><b>₺${TL(o.malzeme+at)}</b></td>
      <td class="c">${o.durum==="Sevkiyat"?'<span class="pill" style="background:#e7f5ec;color:#1b7a3a">Sevk</span>':pct+"%"}</td>
      <td class="c">${o.termin||"—"}</td></tr>`;}).join("")||`<tr><td colspan="9" class="c muted" style="padding:20px">Süzgece uyan kayıt yok</td></tr>`;
  return `<div class="card"><div class="hd">Liste (Süzülebilir) <span class="sub">${rows.length} kayıt · ₺${TL(tSum)}</span><span class="spacer"></span><button class="btn ghost sm" onclick="ozCSV()">⬇ CSV indir</button></div>
    <div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)">
      <select style="${_s}" onchange="setOzF('cust',this.value)"><option value="">Tüm müşteriler</option>${custNames.map(n=>`<option ${f.cust===n?'selected':''}>${esc(n)}</option>`).join("")}</select>
      <select style="${_s}" onchange="setOzF('durum',this.value)"><option value="">Tüm durumlar</option>${STAT_DEF.map(([k])=>`<option ${f.durum===k?'selected':''}>${k}</option>`).join("")}</select>
      <input style="${_s};flex:1;min-width:160px;font-weight:500" placeholder="Ara: müşteri, ürün, kod, emir…" value="${esc(f.q)}" onchange="setOzF('q',this.value)">
      ${(f.cust||f.durum||f.q)?`<button class="btn ghost sm" onclick="window._ozF={cust:'',durum:'',q:''};render()">✕ Temizle</button>`:""}
    </div>
    <div class="tblwrap"><table><thead><tr><th>Emir</th><th>Müşteri</th><th>Ürün</th><th>Durum</th><th class="c">Modül</th><th class="r">Yüzey</th><th class="r">Toplam</th><th class="c">İlerleme</th><th class="c">Termin</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}

/* ============ RAPORLAR (tarih & saat) ============ */
function setRap(id){window._rapSel=id;render();}
function view_rapor(){
  if(!ORDERS.length)return `<div class="top"><div><h1>Raporlar</h1><div class="sub">işlem tarih & saat kayıtları</div></div></div><div class="note">Henüz iş emri yok — kayıt oluşunca burada istasyon başla/bitir zamanları listelenir.</div>`;
  const sel=window._rapSel&&ORDERS.some(o=>o.id===window._rapSel)?window._rapSel:ORDERS[0].id;
  const o=ORDERS.find(x=>x.id===sel);
  const rows=PROD_STEPS.map(s=>{const st=o.steps[s]||{};
    const durum=st.end?'<span class="pill" style="background:#e7f5ec;color:#1b7a3a">Bitti</span>':st.start?'<span class="pill" style="background:#fdf3e3;color:#c07a12">Devam</span>':'<span class="pill" style="background:#f0ece2;color:#6b6b5e">Bekliyor</span>';
    return `<tr><td><b>${s}</b>${s===TEAM_STEP&&o.ekip?` · <span class="muted">👥 ${esc(o.ekip)}</span>`:''}</td>
      <td>${fmtDT(st.start)}</td><td>${fmtDT(st.end)}</td><td>${durTxt(st.start,st.end)}</td>
      <td>${esc(st.byStart||'—')}</td><td>${esc(st.byEnd||'—')}</td><td class="c">${durum}</td></tr>`;}).join("");
  const starts=PROD_STEPS.map(s=>o.steps[s]&&o.steps[s].start).filter(Boolean).sort();
  const ends=PROD_STEPS.map(s=>o.steps[s]&&o.steps[s].end).filter(Boolean).sort();
  const toplam=durTxt(starts[0],ends[ends.length-1]);
  const log=(o.log||[]).slice().reverse().map(e=>`<tr><td>${fmtDT(e.t)}</td><td>${esc(e.ad)}</td><td>${esc(e.olay)}</td><td>${esc(e.kisi)}</td></tr>`).join("")||`<tr><td colspan="4" class="c muted">Kayıt yok</td></tr>`;
  return `<div class="top"><div><h1>Raporlar</h1><div class="sub">işlem tarih & saatleri — kim başlattı / bitirdi</div></div><div class="spacer"></div>
    <select onchange="setRap(this.value)" style="padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-weight:700">${ORDERS.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${x.id} · ${esc(x.musteri)} · ${esc(x.urunAdi)}</option>`).join("")}</select></div>
    <div class="card"><div class="hd">${esc(o.musteri)} › ${esc(o.urunAdi)} <span class="sub">${o.urunKodu} · ${o.projeKodu} · ${o.id}</span><span class="spacer"></span><span class="pill" style="background:#eef3ee;color:#1b3328">Toplam üretim: ${toplam}</span></div>
      <div class="tblwrap"><table><thead><tr><th>İstasyon</th><th>Başladı</th><th>Bitti</th><th>Süre</th><th>Başlayan</th><th>Bitiren</th><th class="c">Durum</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><div class="hd">İşlem Günlüğü <span class="sub">tüm hareketler (yeni → eski)</span></div>
      <div class="tblwrap"><table><thead><tr><th>Tarih / Saat</th><th>İşlem</th><th>Olay</th><th>Kişi</th></tr></thead><tbody>${log}</tbody></table></div></div>`;
}

/* ============ RENDER ============ */
function render(){
  renderNav();
  const v={panel:view_panel,ozet:view_ozet,satis:view_satis,musteriler:view_musteriler,emirler:view_emirler,dizayn:view_dizayn,muhasebe:view_muhasebe,satinalma:view_satinalma,stok:view_stok,uretim:view_uretim,rapor:view_rapor,kullanicilar:view_kullanicilar}[ACTIVE]||view_panel;
  document.getElementById("view").innerHTML=v();
}
// Açılış: mevcut Supabase oturumu var mı? Varsa doğrudan uygulamaya gir.
